# ==============================================================================
# SonarCloud Project Configuration
# ==============================================================================

# Unique identifier representing the organization on SonarCloud
sonar.organization=fortemate

# Project identity
sonar.projectKey=fortemate_dicechess-engine
sonar.projectName=dicechess-engine

# Relative paths to source and test roots. jvm/src/test/java is not listed: Java files
# activate the Java analyser, which needs compiled classes (sonar.java.binaries /
# sonar.java.test.binaries) that this scan does not provide.
sonar.sources=shared-rules/src/main/scala,shared/src/main/scala,jvm/src/main/scala,js/src/main/scala,js-rules/src/main/scala,cli/src/main/scala,arena/src/main/scala,benchmark/src/main/scala
sonar.tests=shared-rules/src/test/scala,shared/src/test/scala,jvm/src/test/scala,js/src/test/scala,js-rules/src/test/scala,cli/src/test/scala,arena/src/test/scala,rules-smoke/src/test/scala

# Scala.js (js/ and js-rules/) is tested, but sbt-scoverage does not instrument this
# platform. The CLI entry point and benchmark/arena runners are also excluded from scoverage.
sonar.coverage.exclusions=**/bench/**,**/benchmark/**,js/src/main/scala/**,js-rules/src/main/scala/**,cli/src/main/scala/dicechess/engine/Main.scala

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Default coverage report paths (CI overrides with dynamically discovered paths via -D).
# rules and engine build with ScalaV, cli and arena with ThisBuild / scalaVersion (build.sbt).
sonar.scala.coverage.reportPaths=target/out/jvm/scala-3.8.4/dicechess-rules/scoverage-report/scoverage.xml,target/out/jvm/scala-3.8.4/dicechess-engine/scoverage-report/scoverage.xml,target/out/jvm/scala-3.9.0/dicechess-cli/scoverage-report/scoverage.xml,target/out/jvm/scala-3.9.0/dicechess-arena/scoverage-report/scoverage.xml

