# ==============================================================================
# SonarCloud Project Configuration
# ==============================================================================

# Unique identifier representing the organization on SonarCloud
sonar.organization=fortemate

# Project identity
sonar.projectKey=fortemate_dicechess-engine
sonar.projectName=dicechess-engine

# Relative paths to source and test roots
sonar.sources=shared/src/main/scala
sonar.tests=shared/src/test/scala,jvm/src/test/scala

# Exclude benchmark/arena runner code from coverage calculations
sonar.coverage.exclusions=**/bench/**,**/benchmark/**

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Default coverage report path (CI overrides with dynamically discovered path via -D)
sonar.scala.coverage.reportPaths=target/out/jvm/scala-3.8.4/dicechess-engine/scoverage-report/scoverage.xml
