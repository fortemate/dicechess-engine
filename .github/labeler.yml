# PR labels matching branch convention and path fallbacks
# Grouped by .github/release.yml for release notes generation.

# ── Branch type → label ─────────────────────────────────────────────────────────
enhancement:
  - head-branch: ['^task/', '^feat/', '^feature/']
bug:
  - head-branch: ['^bug/', '^fix/']
refactoring:
  - head-branch: ['^refactor/']
performance:
  - head-branch: ['^perf/']
  - changed-files:
      - any-glob-to-any-file:
          - 'benchmark/**'

# ── Path fallbacks for branches without a type prefix ───────────────────────────
documentation:
  - head-branch: ['^docs/']
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CONTRIBUTING.md'
          - 'SECURITY.md'
          - 'docs/**'
ci-cd:
  - head-branch: ['^ci/']
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'mise.toml'
          - 'lefthook.yml'
testing:
  - head-branch: ['^test/']
  - changed-files:
      - any-glob-to-any-file:
          - '**/src/test/**'

# ── Domain labels from package paths ───────────────────────────────────────────
# `rules` marks every change to the dicechess-rules jar (#246): its own release-notes section lets
# a rules-only consumer see whether a release carries anything for it. Only the jar's sources count
# (`rulesLayout` in build.sbt), so not tests, and not js-rules/: the npm `./rules` entry is `api`.
# A path cannot tell a jar change in build.sbt or project/ from a version bump: label that by hand.
rules:
  - changed-files:
      - any-glob-to-any-file:
          - 'shared-rules/src/main/**'
core-types:
  - changed-files:
      - any-glob-to-any-file:
          - 'shared-rules/src/main/scala/**/domain/**'
move-gen:
  - changed-files:
      - any-glob-to-any-file:
          - 'shared-rules/src/main/scala/**/movegen/**'
turn-rules:
  - changed-files:
      - any-glob-to-any-file:
          - 'shared-rules/src/main/scala/**/search/TurnGenerator.scala'
search:
  - changed-files:
      - any-glob-to-any-file:
          - 'shared/src/main/scala/**/search/**'
          - 'jvm/src/main/scala/**/search/**'
evaluation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/Evaluator*.scala'
          - '**/KingCapture*.scala'
api:
  - changed-files:
      - any-glob-to-any-file:
          - 'js/**'
          - 'js-rules/**'
          - 'jvm/**'
          - '.wasm/**'
