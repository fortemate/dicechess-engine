name: "Security: Submit sbt Dependency Graph"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.sbt"
      - "project/**"
      - ".github/workflows/dependency-graph.yaml"

permissions: {}

jobs:
  submit:
    name: Submit sbt dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      - name: Stop any persistent sbt server
        run: sbt shutdown
      - name: Submit resolved dependency graph
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          # v3.2.3 of the action still defaults to plugin v3.2.2.
          sbt-plugin-version: 3.2.3
