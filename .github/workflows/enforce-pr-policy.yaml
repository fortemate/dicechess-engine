name: "CI: PR Policy"

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate branch name and linked issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const actor = context.payload.pull_request.user.login;
            if (actor === 'dependabot[bot]' || actor === 'github-actions[bot]') {
              console.log(`Skipping validation for automated PR by ${actor}.`);
              return;
            }
            const headRef = context.payload.pull_request.head.ref;
            const body = context.payload.pull_request.body || "";
            // Allowed branch prefixes: task|feat|feature|bug|refactor|chore|docs|ci|test|perf
            const pattern = /^(task|feat(ure)?|bug|refactor|chore|docs|ci|test|perf)\/((issue-)?(\d+)-)?[a-z0-9-]+$/;
            const issuePattern = /(Closes|Resolves|Fixes)\s+#\d+/i;
            const templatePlaceholder = /Closes\s+#<issue-number>/;

            const isConventional = pattern.test(headRef);
            const hasIssueLink = issuePattern.test(body);

            if (!isConventional) {
              if (!hasIssueLink) {
                core.setFailed(`Branch "${headRef}" does not follow the convention <type>/<short-desc> (or <type>/<id>-<short-desc>) and has no closing issue link. Tool-managed branches must include "Closes #<n>", "Fixes #<n>", or "Resolves #<n>" in the PR body.`);
                return;
              }
              console.log('Tool-managed branch accepted with closing issue link.');
              return;
            }

            const issueIdMatch = headRef.match(/^[a-z]+\/(issue-)?(\d+)-/);
            const hasIssueId = issueIdMatch !== null;
            if (hasIssueId && !hasIssueLink) {
              const issueNumber = issueIdMatch[2];
              const directive = `Closes #${issueNumber}`;
              let updatedBody;
              if (templatePlaceholder.test(body)) {
                updatedBody = body.replace(templatePlaceholder, directive);
              } else {
                updatedBody = body.trimEnd() + `\n\n${directive}`;
              }
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: updatedBody,
              });
              core.notice(`Auto-linked issue: added "${directive}" to the PR description.`);
            }
            console.log('PR policy OK.');
