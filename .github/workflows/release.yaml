name: "Ops: Release"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push tags and create releases
      packages: write # To publish packages
      checks: write # To publish check runs with test reports
      pull-requests: write # To open the next snapshot PR

    steps:
      - name: Verify release branch is main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Releases must be cut from the 'main' branch, but this workflow was triggered from '${{ github.ref }}'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      - name: Setup Node.js
        # Scala.js runs JS/Wasm tests on Node; the Wasm backend (1.22+) emits
        # ES2022 + WebAssembly GC, which needs a current Node, not the runner default.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: "https://npm.pkg.github.com"

      - name: Run validation checks
        # Run sbt directly (no mise): the runner already has the JVM toolchain, jq, and gh,
        # so mise would only install the local-dev tool set for nothing. Runs the same gates
        # as `mise run check`, but deliberately in a different order: scalafmt first to fail
        # fast before any compile. `mise run check`'s clean-before-scalafmtCheckAll ordering
        # (#354) guards against a warm target/, which cannot happen here — the runner starts
        # from a fresh checkout, and setup-java's `cache: sbt` restores only ~/.sbt, ~/.ivy2
        # and the coursier cache, never sbt 2's compile CAS.
        # The cold-cache wrapper keeps the coverage threshold enforceable: a cache-served
        # `compile` skips the compiler, so nothing is instrumented and the 85% threshold goes
        # silently unenforced (#531). Shared with `mise run coverage`/`check` via one script so
        # the two cannot drift; invoked with bash because the runner already provisions the JVM
        # toolchain and needs no mise (same pattern as `bash .mise/tasks/package/prepare`).
        # `rootJVM/coverageDataCheck` fails the build loudly if metadata is missing anyway.
        run: bash .mise/lib/sbt-cold-cache.sh 'scalafmtCheckAll; scalafixAll --check; clean; coverage; testOnly *; rootJVM/coverageDataCheck; arena/coverageDataCheck; cli/coverageDataCheck; coverageReport'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always() # Always run even if tests fail!
        with:
          # sbt 2's shared build cache moved output from <platform>/target/... to
          # target/out/<platform>/scala-<ver>/<module>/...
          report_paths: '**/target/out/**/test-reports/*.xml'
          detailed_summary: true
          include_passed: true

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest tag, or set to v0.0.0 if no tags exist
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const latestTag = '${{ steps.get_tag.outputs.latest_tag }}';
            const bumpType = '${{ github.event.inputs.bump }}';

            let major = 0;
            let minor = 1;
            let patch = 0;

            if (latestTag && latestTag !== 'v0.0.0') {
              const cleanVersion = latestTag.startsWith('v') ? latestTag.slice(1) : latestTag;
              const match = cleanVersion.match(/^(\d+)\.(\d+)\.(\d+)/);

              if (match) {
                major = parseInt(match[1], 10);
                minor = parseInt(match[2], 10);
                patch = parseInt(match[3], 10);

                if (bumpType === 'major') {
                  major += 1;
                  minor = 0;
                  patch = 0;
                } else if (bumpType === 'minor') {
                  minor += 1;
                  patch = 0;
                } else {
                  patch += 1;
                }
              }
            } else {
              // Initial release starting from baseline 0.1.0
              if (bumpType === 'major') {
                major = 1;
                minor = 0;
                patch = 0;
              } else if (bumpType === 'minor') {
                major = 0;
                minor = 2;
                patch = 0;
              } else {
                major = 0;
                minor = 1;
                patch = 0;
              }
            }

            const releaseVersion = `${major}.${minor}.${patch}`;
            const releaseTag = `v${releaseVersion}`;
            const nextSnapshot = `${major}.${minor}.${patch + 1}-SNAPSHOT`;

            core.setOutput('new_version', releaseVersion);
            core.setOutput('new_tag', releaseTag);
            core.setOutput('next_snapshot', nextSnapshot);
            console.log(`Release version: ${releaseVersion} (${releaseTag})`);
            console.log(`Next snapshot: ${nextSnapshot}`);

      - name: Create and push Git tag
        run: |
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push origin ${{ steps.bump_version.outputs.new_tag }}

      - name: Import GPG signing key
        # sbt-pgp reads PGP_PASSPHRASE from the environment to unlock the key.
        # allow-loopback-pinentry lets gpg-agent accept the passphrase non-interactively.
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          echo "$PGP_SECRET" | base64 --decode | gpg --batch --yes --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Publish JVM artifact to Maven Central
        # `sbt shutdown` first, and it is load-bearing twice over. sbt 2's thin client reuses
        # the server started by an earlier step, so this step would otherwise inherit:
        #   1. that step's environment — SONATYPE_* / PGP_* vars not present in the earlier step;
        #   2. its session `set coverageEnabled := true` from the validation run, so with no
        #      recompile forced it would publish coverage-instrumented bytecode.
        # `clean` guarantees a fresh uninstrumented build; assertNoCoverageInstrumentation
        # and assertNoBenchClasses prove it rather than trusting it.
        # publishSigned signs every artifact; sonaRelease uploads the bundle to Maven Central.
        run: |
          sbt shutdown >/dev/null 2>&1 || true
          sbt "set ThisBuild / version := \"${{ steps.bump_version.outputs.new_version }}\"; clean; rootJVM/assertNoCoverageInstrumentation; rootJVM/assertNoBenchClasses; rootJVM/publishSigned; sonaRelease"
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      # package:prepare is a plain bash script (sbt + jq, both on the runner). Run its
      # js:build dependency first, then the script directly — no mise needed.
      - name: Build JavaScript package
        run: |
          sbt rootJS/fullOptJS
          bash .mise/tasks/package/prepare
        env:
          # Pass the version explicitly — the workflow already knows it. Letting the script
          # scrape it back out of sbt cost two releases (#544 and the run after it).
          PACKAGE_VERSION: ${{ steps.bump_version.outputs.new_version }}

      - name: Publish to GitHub Package Registry
        run: |
          if npm view "@fortemate/dicechess-engine@${{ steps.bump_version.outputs.new_version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@fortemate/dicechess-engine@${{ steps.bump_version.outputs.new_version }} is already published, skipping"
          else
            npm publish ./dist
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebAssembly package
        run: |
          sbt rootWasm/fullLinkJS
          bash .mise/tasks/package/prepare-wasm
        env:
          PACKAGE_VERSION: ${{ steps.bump_version.outputs.new_version }}

      - name: Publish Wasm package to GitHub Package Registry
        run: |
          if npm view "@fortemate/dicechess-engine-wasm@${{ steps.bump_version.outputs.new_version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@fortemate/dicechess-engine-wasm@${{ steps.bump_version.outputs.new_version }} is already published, skipping"
          else
            npm publish ./dist-wasm
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump_version.outputs.new_tag }}
        run: |
          gh release create "$NEW_TAG" \
            dist/dicechess-engine.js \
            dist/dicechess-engine.d.ts \
            dist-wasm/main.js \
            dist-wasm/main.wasm \
            dist-wasm/__loader.js \
            --generate-notes \
            --title "$NEW_TAG"

      # The bump commit cannot be pushed straight to a protected `main` without violating
      # branch rulesets. So it goes out on a branch and through a pull request like every other change.
      # The tag push above is direct because branch rulesets do not apply to tags.
      - name: Open the next-SNAPSHOT version-bump pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_SNAPSHOT: ${{ steps.bump_version.outputs.next_snapshot }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.new_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="chore/bump-to-$NEXT_SNAPSHOT"
          git checkout -b "$BRANCH"
          sed -i 's/ThisBuild \/ version[[:space:]]*:= "[^"]*"/ThisBuild \/ version              := "'"$NEXT_SNAPSHOT"'"/' build.sbt

          if ! git diff --quiet build.sbt; then
            git add build.sbt
            git commit -m "chore(release): bump version to $NEXT_SNAPSHOT"
            git push origin "$BRANCH"

            gh pr create -R "$REPO" --base main --head "$BRANCH" \
              --title "chore(release): bump version to $NEXT_SNAPSHOT" \
              --body "Post-release bookkeeping for **$RELEASE_TAG**, opened automatically by \`Ops: Release\`.

          Sets the \`build.sbt\` version to \`$NEXT_SNAPSHOT\` so \`main\` carries the next
          development version. Nothing else changes.

          \`$RELEASE_TAG\`, its artifacts and its GitHub Release are already published —
          this pull request only moves the version forward on \`main\`."
          fi
