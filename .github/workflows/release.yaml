name: "Ops: Release"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions: {}

# A release and its recovery must never publish the same coordinates concurrently.
concurrency:
  group: dicechess-engine-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write # To dispatch CI for the automatically opened snapshot PR
      contents: write # To push tags and create releases
      packages: write # To publish packages
      checks: write # To publish check runs with test reports
      pull-requests: write # To open the next snapshot PR

    steps:
      - name: Verify release branch is main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Releases must be cut from the 'main' branch, but this workflow was triggered from '${{ github.ref }}'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Setup Node.js
        # Scala.js runs JS/Wasm tests on Node; the Wasm backend (1.22+) emits
        # ES2022 + WebAssembly GC, which needs a current Node, not the runner default.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: "https://npm.pkg.github.com"

      - name: Run validation checks
        # Run sbt directly (no mise): the runner already has the JVM toolchain, jq, and gh,
        # so mise would only install the local-dev tool set for nothing. Runs the same gates
        # as `mise run check`, but deliberately in a different order: scalafmt first to fail
        # fast before any compile. `mise run check`'s clean-before-scalafmtCheckAll ordering
        # (#354) guards against a warm target/, which cannot happen here — the runner starts
        # from a fresh checkout, and setup-java's `cache: sbt` restores only ~/.sbt, ~/.ivy2
        # and the coursier cache, never sbt 2's compile CAS.
        # The cold-cache wrapper keeps the coverage threshold enforceable: a cache-served
        # `compile` skips the compiler, so nothing is instrumented and the 85% threshold goes
        # silently unenforced (#531). Shared with `mise run coverage`/`check` via one script so
        # the two cannot drift; invoked with bash because the runner already provisions the JVM
        # toolchain and needs no mise (same pattern as `bash .mise/tasks/package/prepare`).
        # `rootJVM/coverageDataCheck` fails the build loudly if metadata is missing anyway.
        run: bash .mise/lib/sbt-cold-cache.sh 'scalafmtCheckAll; scalafixAll --check; clean; coverage; testOnly *; rootJVM/coverageDataCheck; arena/coverageDataCheck; cli/coverageDataCheck; coverageReport'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always() # Always run even if tests fail!
        with:
          # sbt 2's shared build cache moved output from <platform>/target/... to
          # target/out/<platform>/scala-<ver>/<module>/...
          report_paths: '**/target/out/**/test-reports/*.xml'
          detailed_summary: true
          include_passed: true

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest tag, or set to v0.0.0 if no tags exist
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const latestTag = '${{ steps.get_tag.outputs.latest_tag }}';
            const bumpType = '${{ github.event.inputs.bump }}';

            let major = 0;
            let minor = 1;
            let patch = 0;

            if (latestTag && latestTag !== 'v0.0.0') {
              const cleanVersion = latestTag.startsWith('v') ? latestTag.slice(1) : latestTag;
              const match = cleanVersion.match(/^(\d+)\.(\d+)\.(\d+)/);

              if (match) {
                major = parseInt(match[1], 10);
                minor = parseInt(match[2], 10);
                patch = parseInt(match[3], 10);

                if (bumpType === 'major') {
                  major += 1;
                  minor = 0;
                  patch = 0;
                } else if (bumpType === 'minor') {
                  minor += 1;
                  patch = 0;
                } else {
                  patch += 1;
                }
              }
            } else {
              // Initial release starting from baseline 0.1.0
              if (bumpType === 'major') {
                major = 1;
                minor = 0;
                patch = 0;
              } else if (bumpType === 'minor') {
                major = 0;
                minor = 2;
                patch = 0;
              } else {
                major = 0;
                minor = 1;
                patch = 0;
              }
            }

            const releaseVersion = `${major}.${minor}.${patch}`;
            const releaseTag = `v${releaseVersion}`;
            const nextSnapshot = `${major}.${minor}.${patch + 1}-SNAPSHOT`;

            core.setOutput('new_version', releaseVersion);
            core.setOutput('new_tag', releaseTag);
            core.setOutput('next_snapshot', nextSnapshot);
            console.log(`Release version: ${releaseVersion} (${releaseTag})`);
            console.log(`Next snapshot: ${nextSnapshot}`);

      - name: Create and push Git tag
        run: |
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push origin ${{ steps.bump_version.outputs.new_tag }}

      - name: Check GitHub Packages for this version
        id: github_maven
        env:
          GITHUB_PACKAGE_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          ARTIFACT_BASE="https://maven.pkg.github.com/fortemate/dicechess-engine/com/fortemate/dicechess-engine_3/$RELEASE_VERSION/dicechess-engine_3-$RELEASE_VERSION"
          EXPECTED_SUFFIXES=(.pom .jar -sources.jar -javadoc.jar)
          PRESENT_COUNT=0
          MISSING_COUNT=0
          for SUFFIX in "${EXPECTED_SUFFIXES[@]}"; do
            ARTIFACT_URL="$ARTIFACT_BASE$SUFFIX"
            HTTP_STATUS=$(curl --silent --show-error --location --user "$GITHUB_PACKAGE_USER:$GITHUB_TOKEN" --output /dev/null --write-out '%{http_code}' --retry 3 "$ARTIFACT_URL")
            case "$HTTP_STATUS" in
              200) PRESENT_COUNT=$((PRESENT_COUNT + 1)) ;;
              404) MISSING_COUNT=$((MISSING_COUNT + 1)) ;;
              *) echo "::error::GitHub Packages returned HTTP $HTTP_STATUS for $ARTIFACT_URL"; exit 1 ;;
            esac
          done

          if [[ "$PRESENT_COUNT" -eq "${#EXPECTED_SUFFIXES[@]}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Complete GitHub Maven artifact $RELEASE_VERSION already exists; skipping"
          elif [[ "$MISSING_COUNT" -eq "${#EXPECTED_SUFFIXES[@]}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Maven artifact $RELEASE_VERSION is absent; publishing"
          else
            echo "::error::GitHub Maven artifact $RELEASE_VERSION is partial ($PRESENT_COUNT present, $MISSING_COUNT missing); refusing to overwrite an immutable version"
            exit 1
          fi

      - name: Publish JVM artifact to GitHub Packages
        if: steps.github_maven.outputs.publish == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          sbt --server "set ThisBuild / version := \"$RELEASE_VERSION\"; set rootJVM / publishTo := Some(\"GitHub Packages\" at \"https://maven.pkg.github.com/fortemate/dicechess-engine\"); set ThisBuild / credentials += Credentials(\"GitHub Package Registry\", \"maven.pkg.github.com\", sys.env(\"GITHUB_ACTOR\"), sys.env(\"GITHUB_TOKEN\")); clean; rootJVM/assertNoCoverageInstrumentation; rootJVM/assertNoBenchClasses; rootJVM/publish"

      - name: Check Maven Central for this version
        id: maven
        env:
          RELEASE_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          ARTIFACT_BASE="https://repo1.maven.org/maven2/com/fortemate/dicechess-engine_3/$RELEASE_VERSION/dicechess-engine_3-$RELEASE_VERSION"
          EXPECTED_SUFFIXES=(.pom .jar -sources.jar -javadoc.jar)
          PRESENT_COUNT=0
          MISSING_COUNT=0
          for SUFFIX in "${EXPECTED_SUFFIXES[@]}"; do
            ARTIFACT_URL="$ARTIFACT_BASE$SUFFIX"
            HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 "$ARTIFACT_URL")
            case "$HTTP_STATUS" in
              200) PRESENT_COUNT=$((PRESENT_COUNT + 1)) ;;
              404) MISSING_COUNT=$((MISSING_COUNT + 1)) ;;
              *) echo "::error::Maven Central returned HTTP $HTTP_STATUS for $ARTIFACT_URL"; exit 1 ;;
            esac
          done

          if [[ "$PRESENT_COUNT" -eq "${#EXPECTED_SUFFIXES[@]}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Complete Maven Central artifact $RELEASE_VERSION already exists; skipping"
          elif [[ "$MISSING_COUNT" -eq "${#EXPECTED_SUFFIXES[@]}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Maven Central artifact $RELEASE_VERSION is absent; publishing"
          else
            echo "::error::Maven Central artifact $RELEASE_VERSION is partial ($PRESENT_COUNT present, $MISSING_COUNT missing); refusing to republish an immutable version"
            exit 1
          fi

      - name: Import GPG signing key
        if: steps.maven.outputs.publish == 'true'
        # sbt-pgp reads PGP_PASSPHRASE from the environment to unlock the key.
        # allow-loopback-pinentry lets gpg-agent accept the passphrase non-interactively.
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          echo "$PGP_SECRET" | base64 --decode | gpg --batch --yes --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Publish JVM artifact to Maven Central
        if: steps.maven.outputs.publish == 'true'
        # --server runs a foreground process with this step's environment and session instead
        # of reusing the native thin client's background server.
        # `clean` guarantees a fresh uninstrumented build; assertNoCoverageInstrumentation
        # and assertNoBenchClasses prove it rather than trusting it.
        # publishSigned signs every artifact; sonaRelease uploads the bundle to Maven Central.
        run: sbt --server "set ThisBuild / version := \"$RELEASE_VERSION\"; clean; rootJVM/assertNoCoverageInstrumentation; rootJVM/assertNoBenchClasses; rootJVM/publishSigned; sonaRelease"
        env:
          RELEASE_VERSION: ${{ steps.bump_version.outputs.new_version }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      # package:prepare is a plain bash script (sbt + jq, both on the runner). Run its
      # js:build dependency first, then the script directly — no mise needed.
      - name: Build JavaScript package
        run: |
          sbt --server rootJS/fullOptJS
          bash .mise/tasks/package/prepare
        env:
          # Pass the version explicitly — the workflow already knows it. Letting the script
          # scrape it back out of sbt cost two releases (#544 and the run after it).
          PACKAGE_VERSION: ${{ steps.bump_version.outputs.new_version }}

      - name: Build WebAssembly package
        run: |
          sbt --server rootWasm/fullLinkJS
          bash .mise/tasks/package/prepare-wasm
        env:
          PACKAGE_VERSION: ${{ steps.bump_version.outputs.new_version }}

      - name: Create and verify npm release bundle
        id: npm_bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.new_tag }}
        run: |
          BUNDLE_NAME="npm-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BUNDLE_DIRECTORY="$RUNNER_TEMP/$BUNDLE_NAME"
          bash .mise/lib/create-npm-release-bundle.sh \
            "$BUNDLE_DIRECTORY" \
            "$RELEASE_TAG" \
            "$RELEASE_SHA"
          bash .mise/tasks/package/verify --bundle "$BUNDLE_DIRECTORY"
          MANIFEST_SHA512=$(sha512sum "$BUNDLE_DIRECTORY/manifest.json" | awk '{print $1}')
          echo "name=$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$BUNDLE_DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "manifest_sha512=$MANIFEST_SHA512" >> "$GITHUB_OUTPUT"
          {
            echo "### Immutable npm release bundle"
            echo
            echo "- Source run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Artifact: \`$BUNDLE_NAME\`"
            echo "- Manifest SHA-512: \`$MANIFEST_SHA512\`"
            echo
            jq -r '.packages[] | "- `\(.name)`: `\(.integrity)`"' "$BUNDLE_DIRECTORY/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable npm release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.npm_bundle.outputs.name }}
          path: ${{ steps.npm_bundle.outputs.path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Publish npm release bundle to GitHub Packages
        env:
          BUNDLE_DIRECTORY: ${{ steps.npm_bundle.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .mise/lib/publish-npm-release-bundle.sh "$BUNDLE_DIRECTORY" https://npm.pkg.github.com

      - name: Publish both packages to npmjs.org through the canonical workflow
        env:
          BUNDLE_NAME: ${{ steps.npm_bundle.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_SHA512: ${{ steps.npm_bundle.outputs.manifest_sha512 }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.new_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash .mise/lib/dispatch-npm-publish.sh \
            "$REPOSITORY" \
            "$RELEASE_TAG" \
            "$RELEASE_SHA" \
            "$GITHUB_RUN_ID" \
            "$BUNDLE_NAME" \
            "$MANIFEST_SHA512"

      - name: Create GitHub Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump_version.outputs.new_tag }}
        run: |
          gh release create "$NEW_TAG" \
            dist/dicechess-engine.js \
            dist/dicechess-engine.d.ts \
            dist-wasm/main.js \
            dist-wasm/main.wasm \
            dist-wasm/__loader.js \
            --generate-notes \
            --title "$NEW_TAG"

      # The bump commit cannot be pushed straight to a protected `main` without violating
      # branch rulesets. So it goes out on a branch and through a pull request like every other change.
      # The tag push above is direct because branch rulesets do not apply to tags.
      - name: Open the next-SNAPSHOT version-bump pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_SNAPSHOT: ${{ steps.bump_version.outputs.next_snapshot }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.new_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="chore/bump-to-$NEXT_SNAPSHOT"

          # Publishing can take long enough for main to advance. Base the bookkeeping
          # PR on the latest main so it does not accidentally revert newer workflows.
          git fetch origin main
          BASE_SHA=$(git rev-parse origin/main)
          git checkout -b "$BRANCH" "$BASE_SHA"
          sed -i 's/ThisBuild \/ version[[:space:]]*:= "[^"]*"/ThisBuild \/ version              := "'"$NEXT_SNAPSHOT"'"/' build.sbt

          if ! git diff --quiet build.sbt; then
            changed_files=$(git diff --name-only)
            if [[ "$changed_files" != "build.sbt" ]]; then
              echo "::error::The next-SNAPSHOT commit must only change build.sbt, found: $changed_files"
              exit 1
            fi

            git add build.sbt
            git commit -m "chore(release): bump version to $NEXT_SNAPSHOT"

            # Establish the remote branch at the current main SHA before pushing the
            # bookkeeping commit. The subsequent update then changes only build.sbt
            # and does not require the unavailable Workflows permission.
            if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              echo "::error::Remote branch $BRANCH already exists"
              exit 1
            fi
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/heads/$BRANCH" \
              -f sha="$BASE_SHA" >/dev/null
            git push origin "$BRANCH"

            pr_url=$(gh pr create -R "$REPO" --base main --head "$BRANCH" \
              --title "chore(release): bump version to $NEXT_SNAPSHOT" \
              --body "Post-release bookkeeping for **$RELEASE_TAG**, opened automatically by \`Ops: Release\`.

          Sets the \`build.sbt\` version to \`$NEXT_SNAPSHOT\` so \`main\` carries the next
          development version. Nothing else changes.

          \`$RELEASE_TAG\`, its artifacts and its GitHub Release are already published —
          this pull request only moves the version forward on \`main\`.")
            echo "Opened $pr_url"

            # Pull-request events created by GITHUB_TOKEN require manual approval.
            # A workflow_dispatch run verifies the same head SHA immediately.
            gh workflow run ci.yaml -R "$REPO" --ref "$BRANCH"
          fi
