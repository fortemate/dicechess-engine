name: "CD: Deploy Documentation"

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'shared-rules/src/main/scala/**'
      - 'shared/src/main/scala/**'
      - 'jvm/src/main/scala/**'
      - 'js/src/main/scala/**'
      - 'shared-rules/src/test/scala/dicechess/engine/movegen/MoveGenFixtures.scala'
      - 'shared-rules/src/test/scala/dicechess/engine/movegen/ChessDsl.scala'
      - 'shared-rules/src/test/scala/dicechess/engine/search/KingCaptureFixtures.scala'
      - 'jvm/src/test/scala/dicechess/engine/search/KingCaptureDocGenerator.scala'
      - '.mise/lib/sbt-cold-cache.sh'
      - '.github/workflows/deploy-docs.yaml'

  # Allows manual execution from Actions tab
  workflow_dispatch:

permissions: {}

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BUILD_PATH: "./docs"

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: "${{ env.BUILD_PATH }}/package-lock.json"

      - name: Install Node Dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Generate Visual Test Cases Catalog
        # sbt 2 requires the whole chain as ONE semicolon-joined command — separate CLI
        # args (sbt 1 style) fail to parse.
        run: sbt 'project rootJVM; Test / runMain dicechess.engine.movegen.DocGenerator'

      - name: Generate King Capture Probability Test Cases Catalog
        run: sbt 'project rootJVM; Test / runMain dicechess.engine.search.KingCaptureDocGenerator'

      - name: Build with Astro
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Generate Scaladoc
        # One API tree over both artifacts: the apiDocs project sees every JVM source root (#219).
        # Cold cache ensures the compiler actually runs and generates the pages (#531).
        run: bash .mise/lib/sbt-cold-cache.sh 'apiDocs/doc'

      - name: Merge Scaladoc into Astro dist
        # sbt 2's shared build cache moved output from jvm/target/... to
        # target/out/jvm/scala-<ver>/<module>/... — still goes stale on a scalaVersion
        # bump (see AGENTS.md Documentation section).
        run: |
          mkdir -p ${{ env.BUILD_PATH }}/dist/api
          # Exactly the apiDocs tree: the rules and engine rows also produce api/ directories for
          # their javadoc jars, and `-print -quit` would pick whichever comes first.
          api_dir=$(find target/out/jvm -type d -path '*/dicechess-api-docs/api' -print -quit)
          if [ -z "$api_dir" ]; then
            echo "::error::apiDocs Scaladoc directory not found under target/out/jvm (expected */dicechess-api-docs/api)"
            echo "Contents of target/out/jvm:"
            ls -la target/out/jvm/ || true
            exit 1
          fi
          cp -r "$api_dir"/* ${{ env.BUILD_PATH }}/dist/api/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "${{ env.BUILD_PATH }}/dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
