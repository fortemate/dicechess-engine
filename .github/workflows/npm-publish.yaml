name: "CD: Publish npmjs.org"
run-name: "Publish ${{ inputs.tag }} to npmjs.org"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact vX.Y.Z release tag to publish"
        required: true
        type: string
      sha:
        description: "Full commit SHA that the release tag must resolve to"
        required: true
        type: string

permissions: {}

concurrency:
  group: npmjs-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not an exact vX.Y.Z release tag"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$EXPECTED_SHA' is not a full commit SHA"
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          TAG_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ "$TAG_SHA" != "$EXPECTED_SHA" || "$HEAD_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::$RELEASE_TAG resolves to $TAG_SHA and HEAD is $HEAD_SHA; expected $EXPECTED_SHA"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: "sbt"

      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm supports Trusted Publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm 11.5.1 or newer is required, found ${major}.${minor}.${patch}`);
            }
          ' "$(npm --version)"

      - name: Build JavaScript packages
        env:
          PACKAGE_VERSION: ${{ inputs.tag }}
        run: |
          sbt 'rootJS/fullOptJS; rootWasm/fullLinkJS'
          bash .mise/tasks/package/prepare
          bash .mise/tasks/package/prepare-wasm

      - name: Verify package tarballs and clean installation
        run: bash .mise/tasks/package/verify

      - name: Publish JavaScript package to npmjs.org
        run: bash .mise/lib/npm-publish-if-missing.sh ./dist https://registry.npmjs.org --provenance

      - name: Publish WebAssembly package to npmjs.org
        run: bash .mise/lib/npm-publish-if-missing.sh ./dist-wasm https://registry.npmjs.org --provenance
